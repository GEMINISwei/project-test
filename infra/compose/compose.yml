# api、migrate、worker 是同一個 image 的三種跑法, 共用的部分只寫一次。
x-api: &api
  image: ${API_IMAGE:-${COMPOSE_PROJECT_NAME:?}-api:latest}
  pull_policy: ${IMAGE_PULL_POLICY:-build}
  build:
    context: ../../apps/api
  environment:
    PROJECT_NAME: ${COMPOSE_PROJECT_NAME:?}
    MODE: ${MODE:?}
    POSTGRES_URL: postgresql+asyncpg://app:${POSTGRES_PASSWORD:?}@postgres:5432/app
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:?}
    EXPIRE_HOURS: ${EXPIRE_HOURS:?}
    TIMEZONE: ${TIMEZONE:-Asia/Taipei}
    API_PROCESSES: ${API_PROCESSES:-1}
    SENTRY_DSN: ${SENTRY_DSN:-}

# 啟動期間每秒檢查, 之後放慢; 單機 compose 的 healthcheck 只用在啟動順序與部署閘門。
x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  start_period: 60s
  start_interval: 1s
  retries: 3

services:
  postgres:
    container_name: ${COMPOSE_PROJECT_NAME:?}-postgres
    # 跨 major 升級要 pg_dump → 換版本 → pg_restore, 不是改版本號。
    image: postgres:18.6-alpine
    environment:
      # 帳號與資料庫名稱寫死: 只有這個 compose 專案連得到, 指令在容器裡讀這兩個值。
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: app
      # collation 會寫進索引, 之後改要重建資料庫, 所以明確指定。
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      # PostgreSQL 18 的映像檔把資料放在 /var/lib/postgresql/<major>/docker。
      - postgres_data:/var/lib/postgresql
    healthcheck:
      <<: *healthcheck
      # -h 127.0.0.1: 走 unix socket 的話 initdb 期間就會提早轉綠。
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    restart: always

  # 一次性的 migration 與 seed。api 與 worker 等它成功才啟動, 不會出現新程式配舊資料。
  migrate:
    <<: *api
    container_name: ${COMPOSE_PROJECT_NAME:?}-migrate
    command: ["python", "-m", "app.cli", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api
    container_name: ${COMPOSE_PROJECT_NAME:?}-api
    command: ["python", "-m", "app.api"]
    volumes:
      # 上傳的檔案一律放這裡 (各模組一個子目錄), make backup 只備份這個 volume。
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *healthcheck
      # 用 bash 的 /dev/tcp (約 4ms): 每次起一個 python 都是 docker stats 裡的一個尖峰。
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
    # 給進行中的請求時間做完 (uvicorn 收到 SIGTERM 後不再接新連線)。
    stop_grace_period: 30s
    restart: always
    expose:
      - "8000"

  # 背景工作與排程。與 api 同一個 image, 佇列放在 PostgreSQL。
  # 多份時每一份都做一樣的事, 同一個任務只有一份拿得到。容器名稱由 compose 依序編號
  # (<專案>-worker-<序號>): 指定 container_name 就不能開多份。
  worker:
    <<: *api
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    command: ["python", "-m", "app.worker"]
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *healthcheck
      # worker 每 15 秒確認資料庫連得上並更新這個檔案; 超過一分鐘沒更新就是卡住或連不上。
      test: ["CMD", "bash", "-c", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/worker-heartbeat) )) -lt 60"]
    # 收到 SIGTERM 會做完手上的任務再結束: 單一任務的時間上限 (shared/jobs 的 MAX_TIMEOUT_SECONDS)
    # 加 30 秒寫入完成狀態。
    stop_grace_period: 330s
    restart: always

  web:
    container_name: ${COMPOSE_PROJECT_NAME:?}-web
    image: ${WEB_IMAGE:-${COMPOSE_PROJECT_NAME:?}-web:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-build}
    build:
      context: ../../apps/web
      target: prod
    environment:
      API_URL: http://api:8000
      SYSTEM_NAME: ${SYSTEM_NAME:?}
      # 決定 cookie 的 maxAge, 必須與 api 是同一個值。
      EXPIRE_HOURS: ${EXPIRE_HOURS:?}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:?}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      # 探 /healthz 而不是真實頁面: 頁面會打後端, web 的健康狀態會跟著 api 一起紅。
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3000 && printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
    restart: always
    expose:
      - "3000"

  nginx:
    container_name: ${COMPOSE_PROJECT_NAME:?}-nginx
    image: nginx:1.30.6-alpine
    # bind mount 的內容變了 compose 看不出來, 把設定的雜湊放進 label, 變了才會重建。
    labels:
      project.nginx-config-hash: ${NGINX_CONFIG_HASH:?}
    # 只綁 loopback: 對外由主機的 reverse proxy 負責, 這層信任它送來的用戶端 IP。
    # 綁 0.0.0.0 的話外部可以繞過主機直接連, 自己帶 X-Real-IP 冒充任何 IP。
    ports:
      - 127.0.0.1:${SYSTEM_PORT:?}:80
    volumes:
      - ../nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../nginx/snippets:/etc/nginx/snippets:ro
    depends_on:
      web:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:?}_${MODE:?}_postgres_data
  uploads:
    name: ${COMPOSE_PROJECT_NAME:?}_${MODE:?}_uploads
