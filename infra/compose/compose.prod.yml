# 正式環境: 記憶體上限。吃爆時只有那個容器被 OOM kill, 不會拖垮整台主機。
# migrate 刻意不設上限: 被 OOM kill 的後果是資料改到一半。
services:
  postgres:
    deploy:
      resources:
        limits:
          memory: 1G
  api:
    deploy:
      resources:
        limits:
          memory: 512M
  worker:
    deploy:
      resources:
        limits:
          memory: 512M
  web:
    deploy:
      resources:
        limits:
          memory: 512M
